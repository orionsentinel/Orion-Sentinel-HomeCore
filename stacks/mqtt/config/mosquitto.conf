# =============================================================================
# Mosquitto MQTT Broker Configuration
# =============================================================================
# Default configuration - anonymous access allowed on LAN
# For production use, enable authentication (see CONFIGURATION.md)
# =============================================================================

# Listener configuration
listener 1883

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Allow anonymous connections (disable for production)
# Set to false and create password file for authentication
allow_anonymous true

# Password file (uncomment after creating passwords)
# password_file /mosquitto/config/passwords/passwd

# WebSocket listener (optional, uncomment if needed)
# listener 9001
# protocol websockets
