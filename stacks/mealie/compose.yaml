# =============================================================================
# Mealie Stack (Recipe Manager with PostgreSQL)
# =============================================================================

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      - BASE_URL=http://localhost:${MEALIE_PORT:-9000}
      # Database configuration
      - DB_ENGINE=postgres
      - POSTGRES_USER=${POSTGRES_USER:-mealie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=mealie-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mealie}
      # Security
      - SECRET=${MEALIE_SECRET_KEY}
    volumes:
      - ${DATA_ROOT}/mealie/data:/app/data
    ports:
      - "${HOST_IP:-0.0.0.0}:${MEALIE_PORT:-9000}:9000"
    networks:
      - homecore_internal
    depends_on:
      mealie-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/app/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - mealie

  mealie-db:
    image: postgres:15-alpine
    container_name: mealie-db
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      - POSTGRES_USER=${POSTGRES_USER:-mealie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-mealie}
    volumes:
      - ${DATA_ROOT}/mealie/postgres:/var/lib/postgresql/data
    networks:
      - homecore_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealie} -d ${POSTGRES_DB:-mealie}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - mealie
