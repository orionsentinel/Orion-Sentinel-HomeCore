# =============================================================================
# Homepage Settings
# =============================================================================
# Main settings for the Homepage dashboard
# =============================================================================

title: Orion Home
favicon: https://cdn-icons-png.flaticon.com/512/3176/3176369.png
theme: dark
color: slate

# Background (optional - uncomment to enable)
# background:
#   image: /images/background.jpg
#   blur: sm
#   saturate: 50
#   brightness: 50
#   opacity: 50

# Layout configuration
layout:
  HomeCore:
    style: row
    columns: 4
  DataAICore:
    style: row
    columns: 3

# Show icons for services
showStats: true

# Enable search
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
