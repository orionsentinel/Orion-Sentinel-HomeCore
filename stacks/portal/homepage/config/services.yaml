# =============================================================================
# Homepage Services
# =============================================================================
# Most services are auto-discovered from Docker labels across all nodes
# Manual entries below are for non-Docker services or special widgets
# =============================================================================

---
# Observability & Monitoring (Manual links to DataAICore)
- Observability:
    - Grafana:
        icon: grafana
        href: http://${DATAAICORE_NODE_IP:-192.168.1.10}:${GRAFANA_PORT:-3000}
        description: Metrics and dashboards
        
    - Prometheus:
        icon: prometheus
        href: http://${DATAAICORE_NODE_IP:-192.168.1.10}:${PROM_PORT:-9090}
        description: Metrics collection
        
    - Loki:
        icon: loki
        href: http://${DATAAICORE_NODE_IP:-192.168.1.10}:${LOKI_PORT:-3100}
        description: Log aggregation

