# =============================================================================
# Immich Stack (Photo/Video Backup with PostgreSQL + Valkey)
# =============================================================================
# Self-hosted replacement for Google Photos / iCloud Photos.
# Mirrors the upstream release compose file
# (https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml)
# with HomeCore conventions: pinned version, profile-gated, loopback binding by
# default, and the database/cache on an internal-only network.
#
# Storage:
#   ${IMMICH_UPLOAD_LOCATION}       Originals, thumbnails, encoded video and
#                                   Immich's own nightly DB dumps (bulk drive)
#   ${DATA_ROOT}/immich/postgres    Database - local SSD/NVMe only, never a
#                                   network share or FAT/exFAT/NTFS
#
# Upgrades: read the release notes before bumping IMMICH_VERSION. The database
# and Valkey images are digest-pinned to what upstream ships with the release.
#
# Deploy: ./scripts/deploy-media.sh (preflight, directories, secrets, Tailscale)
# =============================================================================

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.5}
    container_name: immich_server
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      - DB_HOSTNAME=immich-database
      - DB_USERNAME=${IMMICH_DB_USERNAME:-postgres}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-/srv/orion/media/immich}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${HOST_IP:-127.0.0.1}:${IMMICH_PORT:-2283}:2283"
    networks:
      - immich_internal
      - immich_lan
    depends_on:
      - immich-redis
      - immich-database
    # Healthcheck is built into the image
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          memory: "512M"
    profiles:
      - immich

  # Face recognition, smart search (CLIP) and OCR. CPU-only on a Pi 5: the
  # VideoCore GPU and Hailo NPU are not supported Immich ML backends.
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.5}
    container_name: immich_machine_learning
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      # Default is [::], which fails on kernels booted with ipv6.disable=1;
      # Docker bridge networks are IPv4, so nothing is lost
      - IMMICH_HOST=0.0.0.0
      # Leave cores free for Home Assistant and the rest of the host
      - MACHINE_LEARNING_REQUEST_THREADS=${IMMICH_ML_THREADS:-2}
    volumes:
      - ${DATA_ROOT}/immich/model-cache:/cache
    networks:
      # Needs egress to download models on first use
      - immich_lan
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        # Hard cap so a runaway cannot OOM the whole host. Measured peak with
        # CLIP + face + OCR models loaded at once is ~3GB; 2G gets OOM-killed.
        # Models unload after 5 minutes idle.
        limits:
          memory: "${IMMICH_ML_MEM_LIMIT:-4G}"
    profiles:
      - immich

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    restart: unless-stopped
    networks:
      - immich_internal
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - immich

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - POSTGRES_USER=${IMMICH_DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:-}
      - POSTGRES_DB=${IMMICH_DB_DATABASE_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${DATA_ROOT}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich_internal
    # Healthcheck is built into the image
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - immich

networks:
  # Database and cache are unreachable from outside the stack
  immich_internal:
    name: immich_internal
    internal: true
  immich_lan:
    name: immich_lan
