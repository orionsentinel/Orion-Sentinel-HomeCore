# =============================================================================
# Status Stack (Uptime Kuma)
# =============================================================================
# Service uptime monitoring for all Orion nodes
# Creates monitors and status pages for all services
# =============================================================================

services:
  uptime-kuma:
    image: louislam/uptime-kuma:${KUMA_IMAGE_TAG:-1}
    container_name: uptime-kuma
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
    volumes:
      - ${DATA_ROOT}/uptime-kuma:/app/data
    ports:
      - "${HOST_IP:-127.0.0.1}:${KUMA_PORT:-3001}:3001"
    networks:
      - homecore_internal
      - homecore_lan
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          memory: "128M"
    profiles:
      - status
    labels:
      - homepage.group=HomeCore
      - homepage.name=Uptime Kuma
      - homepage.icon=uptime-kuma
      - homepage.href=http://${HOST_IP:-127.0.0.1}:${KUMA_PORT:-3001}
      - homepage.description=Service uptime monitoring
      - homepage.weight=10
      - homepage.instance=homecore
